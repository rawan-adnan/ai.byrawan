<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المساعد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
  :root{
    --accent:#6b4fe0; --bg:#f6f5f2; --panel:#ffffff; --ink:#1b1a22; --muted:#6e6b78; --line:#e7e4ee;
    --bot:#f1eff6; --font:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{--bg:#121117;--panel:#1a1920;--ink:#f0eef6;--muted:#a19dad;--line:#2b2934;--bot:#24222d;color-scheme:dark}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;display:flex;justify-content:center}
  .app{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;background:var(--panel);border-inline:1px solid var(--line)}
  header{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid var(--line)}
  .dot{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
  header h1{font-size:17px;margin:0;font-weight:600}
  header p{margin:0;font-size:13px;color:var(--muted)}
  .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2fb36b;margin-inline-end:5px}
  main{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
  .bot{background:var(--bot);align-self:flex-start;border-start-start-radius:4px}
  .me{background:var(--accent);color:#fff;align-self:flex-end;border-start-end-radius:4px}
  .err{background:transparent;border:1px dashed #c94b4b;color:#c94b4b;align-self:center;font-size:14px}
  .typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chips button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer}
  .chips button:hover{border-color:var(--accent)}
  form{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  textarea{flex:1;min-width:0;font:inherit;resize:none;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg);color:var(--ink);max-height:120px}
  textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .send{flex:none;width:46px;border:0;border-radius:14px;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center}
  .send:disabled{opacity:.45;cursor:default}
  [dir=rtl] .send svg{transform:scaleX(-1)}
  footer{font-size:11px;color:var(--muted);text-align:center;padding-bottom:8px}
  @media (prefers-reduced-motion:reduce){.typing span{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="dot" id="avatar">•</div>
    <div><h1 id="title">المساعد</h1><p><span class="live"></span><span id="subtitle">بيجاوب من معلومات المحل</span></p></div>
  </header>
  <main id="log" aria-live="polite"></main>
  <form id="f">
    <textarea id="q" rows="1" placeholder="اكتب سؤالك..." aria-label="سؤالك"></textarea>
    <button class="send" id="send" type="submit" aria-label="إرسال">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <footer>مبني بكلود</footer>
</div>
<script>
const log=document.getElementById("log"), q=document.getElementById("q"), send=document.getElementById("send");
const history=[]; let busy=false;

function add(text,cls){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}

async function ask(text){
  if(busy||!text.trim())return;
  busy=true;send.disabled=true;
  document.querySelector(".chips")?.remove();
  add(text,"me");history.push({role:"user",content:text});
  const t=add("","bot typing");t.innerHTML="<span></span><span></span><span></span>";
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
    const data=await r.json();
    t.remove();
    if(!r.ok||!data.reply){history.pop();add(data.error||"صار في مشكلة، جرب كمان شوي.","err");}
    else{add(data.reply,"bot");history.push({role:"assistant",content:data.reply});}
  }catch(e){t.remove();history.pop();add("ما في اتصال، تأكد من النت وجرب كمان مرة.","err")}
  busy=false;send.disabled=false;q.focus();
}

document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();const v=q.value;q.value="";q.style.height="";ask(v)});
q.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();document.getElementById("f").requestSubmit()}});
q.addEventListener("input",()=>{q.style.height="auto";q.style.height=q.scrollHeight+"px"});

fetch("/api/config").then(r=>r.json()).then(c=>{
  document.title=c.botName;
  document.getElementById("title").textContent=c.botName;
  document.getElementById("subtitle").textContent="بيجاوب من معلومات "+c.businessName;
  document.getElementById("avatar").textContent=(c.businessName||"•").trim().charAt(0);
  if(c.accentColor)document.documentElement.style.setProperty("--accent",c.accentColor);
  if(c.language&&c.language!=="ar"){document.documentElement.lang=c.language;document.documentElement.dir="ltr"}
  add(c.welcome,"bot");
  if(c.suggestions?.length){
    const box=document.createElement("div");box.className="chips";
    c.suggestions.forEach(s=>{const b=document.createElement("button");b.type="button";b.textContent=s;b.onclick=()=>ask(s);box.appendChild(b)});
    log.appendChild(box);
  }
}).catch(()=>add("أهلا! اسألني أي شي عن المحل.","bot"));
</script>
</body>
</html>
